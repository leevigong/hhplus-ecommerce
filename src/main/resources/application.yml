spring:
  application:
    name: hhplus
  profiles:
    active: local
  datasource:
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000
      max-lifetime: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379


  kafka:
    bootstrap-servers: localhost:9094
    producer:
      client-id: hhplus-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 5  # 비동기 재시도 횟수
      properties:
        linger.ms: 10                    # 0.01초 모아서 배치 전송 → 성능 테스팅 편리
        allow.auto.create.topics: true   # 개발환경 true (운영에선 false)

    consumer:
      group-id: hhplus-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest          # 토픽이 새로 생기면 처음부터 읽어 확인
      properties:
        spring.json.trusted.packages: '*'
        enable.auto.commit: false          # 수동 커밋 테스트

    properties:
      request.timeout.ms: 15000
      retry.backoff.ms: 300

    listener:
      ack-mode: MANUAL_IMMEDIATE          # 리스너에서 ack.acknowledge() 호출 시 즉시 커밋


logging:
  level:
    kr.hhplus.be.server.support.lock: debug

---
spring.config.activate.on-profile: local, test

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/hhplus?characterEncoding=UTF-8&serverTimezone=UTC
    username: application
    password: application
